<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Run Buddy</title>
    
    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Run Buddy">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3048/3048384.png">
    
    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg: #000000;
            --card: #121214;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.4);
            --text: #ffffff;
            --text-dim: #71717a;
            --run-color: #ef4444;
            --walk-color: #3b82f6;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: calc(var(--safe-top) + 1.5rem) 1.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 18, 20, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            color: var(--accent);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--text-dim);
            letter-spacing: 0.1em;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 0 0px rgba(34, 197, 94, 0.4); }
            70% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { opacity: 1; }
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 0.5rem;
            cursor: pointer;
        }

        /* Main Display */
        .main-display {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .screen {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            text-align: center;
        }

        .hidden { display: none !important; }

        /* Idle Screen */
        .logo-container {
            width: 110px;
            height: 110px;
            background: var(--accent);
            border-radius: 2.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        .welcome-text h2 { font-size: 2.2rem; font-weight: 900; letter-spacing: -0.02em; }
        .welcome-text .summary { color: var(--text-dim); margin-top: 0.5rem; font-weight: 500; }
        .welcome-text .duration { color: var(--accent); font-weight: 800; font-size: 0.9rem; }

        .ios-alert {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1rem;
            border-radius: 1.2rem;
            text-align: left;
        }

        .alert-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.65rem;
            font-weight: 900;
            color: var(--text-dim);
            margin-bottom: 0.4rem;
        }

        .ios-alert p { font-size: 0.75rem; color: var(--text-dim); line-height: 1.4; }

        .btn-primary {
            width: 100%;
            padding: 1.4rem;
            background: white;
            color: black;
            border: none;
            border-radius: 2rem;
            font-size: 1.1rem;
            font-weight: 900;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        /* Active Screen */
        .phase-badge {
            padding: 0.5rem 1.8rem;
            background: var(--walk-color);
            border-radius: 2rem;
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background-color 0.3s;
        }

        .timer {
            font-size: 7.5rem;
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .timer-label { font-size: 0.6rem; font-weight: 800; color: var(--text-dim); letter-spacing: 0.2em; margin-top: -0.5rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            width: 100%;
        }

        .stat-card {
            background: var(--card);
            padding: 1.2rem;
            border-radius: 1.8rem;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .stat-label { font-size: 0.6rem; font-weight: 800; color: var(--text-dim); letter-spacing: 0.1em; display: block; margin-bottom: 0.2rem;}
        .stat-value { font-size: 1.8rem; font-weight: 900; }
        .highlight { color: var(--accent); }

        .workout-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-secondary {
            width: 3.5rem;
            height: 3.5rem;
            background: var(--card);
            border: none;
            border-radius: 1.2rem;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-main-action {
            width: 5.5rem;
            height: 5.5rem;
            background: white;
            border: none;
            border-radius: 50%;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 40px rgba(255,255,255,0.1);
            cursor: pointer;
        }

        /* Footer */
        .progress-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: var(--safe-bottom);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            transition: width 0.4s ease-linear;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: black;
            z-index: 100;
            padding: 2rem;
            padding-top: calc(var(--safe-top) + 2rem);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h2 { font-weight: 900; letter-spacing: -0.02em; }

        .btn-close {
            padding: 0.6rem 1.5rem;
            background: white;
            color: black;
            border: none;
            border-radius: 1rem;
            font-weight: 900;
            cursor: pointer;
        }

        .settings-body { display: flex; flex-direction: column; gap: 0.8rem; }

        .setting-row {
            background: var(--card);
            padding: 1rem 1.5rem;
            border-radius: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-row label { font-size: 0.7rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; }

        .setting-row input {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 1.4rem;
            font-weight: 900;
            text-align: right;
            width: 80px;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-info">
                <h1>RUN BUDDY</h1>
                <div class="status-indicator">
                    <span class="dot pulse"></span>
                    SYSTEM ACTIVE
                </div>
            </div>
            <div class="header-actions">
                <button id="muteBtn" class="icon-btn" aria-label="Mute">
                    <i data-lucide="volume-2"></i>
                </button>
                <button id="settingsBtn" class="icon-btn" aria-label="Settings">
                    <i data-lucide="settings"></i>
                </button>
            </div>
        </header>

        <!-- Main Display -->
        <main class="main-display">
            <!-- Idle Screen -->
            <div id="screen-idle" class="screen">
                <div class="logo-container">
                    <i data-lucide="activity" size="64"></i>
                </div>
                <div class="welcome-text">
                    <h2>READY TO START?</h2>
                    <p class="summary">8 Rounds • 1m Run / 3m Walk</p>
                    <p class="duration">Total Time: 42:00</p>
                </div>
                <div class="ios-alert">
                    <div class="alert-header">
                        <i data-lucide="shield-check" size="16"></i>
                        <span>IOS OPTIMIZED</span>
                    </div>
                    <p>Ensure the physical silent switch is OFF to hear instructions over your music.</p>
                </div>
                <button id="startBtn" class="btn-primary">START SESSION</button>
            </div>

            <!-- Active Workout Screen -->
            <div id="screen-active" class="screen hidden">
                <div id="phaseBadge" class="phase-badge">WARM UP</div>
                
                <div class="timer-container">
                    <div id="timerDisplay" class="timer">05:00</div>
                    <p class="timer-label">TIME REMAINING</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">ROUND</span>
                        <span id="roundDisplay" class="stat-value">1/8</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">NEXT</span>
                        <span id="nextPhaseDisplay" class="stat-value highlight">RUN</span>
                    </div>
                </div>

                <div class="workout-controls">
                    <button id="resetBtn" class="btn-secondary">
                        <i data-lucide="rotate-ccw"></i>
                    </button>
                    <button id="playPauseBtn" class="btn-main-action">
                        <i data-lucide="pause"></i>
                    </button>
                    <button id="skipBtn" class="btn-secondary">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>
            </div>
        </main>

        <!-- Progress Footer -->
        <div class="progress-track">
            <div id="progressBar" class="progress-fill"></div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>WORKOUT MODS</h2>
                    <button id="closeSettings" class="btn-close">DONE</button>
                </div>
                <div class="settings-body">
                    <div class="setting-row">
                        <label>Warm Up (sec)</label>
                        <input type="number" id="input-warmup" value="300">
                    </div>
                    <div class="setting-row">
                        <label>Run Phase (sec)</label>
                        <input type="number" id="input-run" value="60">
                    </div>
                    <div class="setting-row">
                        <label>Walk Phase (sec)</label>
                        <input type="number" id="input-walk" value="180">
                    </div>
                    <div class="setting-row">
                        <label>Rounds</label>
                        <input type="number" id="input-rounds" value="8">
                    </div>
                    <div class="setting-row">
                        <label>Cool Down (sec)</label>
                        <input type="number" id="input-cooldown" value="300">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Application State ---
        let status = 'idle'; 
        let phase = 'warmup'; 
        let timeLeft = 0;
        let currentRound = 1;
        let isMuted = false;

        // Default Configuration
        let config = {
            warmup: 300, 
            run: 60,     
            walk: 180,    
            rounds: 8,
            cooldown: 300 
        };

        let timerInterval = null;
        let targetTime = null; 
        let audioCtx = null;

        // --- UI Element Selectors ---
        const screens = {
            idle: document.getElementById('screen-idle'),
            active: document.getElementById('screen-active')
        };

        const ui = {
            timer: document.getElementById('timerDisplay'),
            badge: document.getElementById('phaseBadge'),
            round: document.getElementById('roundDisplay'),
            nextPhase: document.getElementById('nextPhaseDisplay'),
            progress: document.getElementById('progressBar'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            settings: document.getElementById('settingsModal')
        };

        // --- Background Audio Persistent Fix ---
        function startAudioHeartbeat() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime); // SILENT
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        }

        // --- Voice Synthesis ---
        function speak(text) {
            if ('speechSynthesis' in window && !isMuted) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- Core Logic ---
        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            ui.timer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            ui.round.textContent = `${currentRound}/${config.rounds}`;
            ui.badge.textContent = phase === 'warmup' ? 'WARM UP' : phase === 'cooldown' ? 'COOL DOWN' : phase.toUpperCase();
            ui.nextPhase.textContent = phase === 'run' ? 'WALK' : 'RUN';
            
            ui.badge.style.backgroundColor = phase === 'run' ? '#ef4444' : '#3b82f6';
            
            const phaseDuration = config[phase];
            const phaseDone = (phaseDuration - timeLeft) / phaseDuration;
            const totalDone = ((currentRound - 1 + phaseDone) / config.rounds) * 100;
            ui.progress.style.width = `${Math.min(100, totalDone)}%`;
        }

        function handleTransition() {
            if (phase === 'warmup') {
                phase = 'run';
                timeLeft = config.run;
                speak(`Warm up finished. Run for ${config.run} seconds.`);
            } else if (phase === 'run') {
                phase = 'walk';
                timeLeft = config.walk;
                speak("Switch to walking. Recover for three minutes.");
            } else if (phase === 'walk') {
                if (currentRound < config.rounds) {
                    currentRound++;
                    phase = 'run';
                    timeLeft = config.run;
                    speak(`Round ${currentRound}. Start running.`);
                } else {
                    phase = 'cooldown';
                    timeLeft = config.cooldown;
                    speak("Intervals complete. Five minute cool down walk.");
                }
            } else if (phase === 'cooldown') {
                status = 'finished';
                speak("Workout complete. Fantastic effort today.");
                resetWorkout();
                return;
            }

            targetTime = Date.now() + (timeLeft * 1000);
            updateDisplay();
        }

        function startWorkout() {
            startAudioHeartbeat();
            status = 'active';
            phase = 'warmup';
            timeLeft = config.warmup;
            currentRound = 1;
            targetTime = Date.now() + (timeLeft * 1000);

            screens.idle.classList.add('hidden');
            screens.active.classList.remove('hidden');

            speak("Starting session. Five minute warm up walk starts now.");
            startTimerLoop();
        }

        function startTimerLoop() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                timeLeft = Math.max(0, Math.ceil((targetTime - now) / 1000));
                updateDisplay();
                
                if (timeLeft <= 0) {
                    handleTransition();
                }
            }, 500); 
        }

        function togglePause() {
            if (status === 'active') {
                status = 'paused';
                clearInterval(timerInterval);
                ui.playPauseBtn.innerHTML = '<i data-lucide="play"></i>';
            } else {
                status = 'active';
                targetTime = Date.now() + (timeLeft * 1000);
                startTimerLoop();
                ui.playPauseBtn.innerHTML = '<i data-lucide="pause"></i>';
            }
            lucide.createIcons();
        }

        function resetWorkout() {
            clearInterval(timerInterval);
            status = 'idle';
            screens.idle.classList.remove('hidden');
            screens.active.classList.add('hidden');
            ui.progress.style.width = '0%';
        }

        // --- Events ---
        document.getElementById('startBtn').addEventListener('click', startWorkout);
        document.getElementById('resetBtn').addEventListener('click', resetWorkout);
        document.getElementById('playPauseBtn').addEventListener('click', togglePause);
        document.getElementById('skipBtn').addEventListener('click', handleTransition);

        document.getElementById('muteBtn').addEventListener('click', function() {
            isMuted = !isMuted;
            this.innerHTML = isMuted ? '<i data-lucide="volume-x"></i>' : '<i data-lucide="volume-2"></i>';
            this.style.color = isMuted ? '#ef4444' : '#2563eb';
            lucide.createIcons();
        });

        document.getElementById('settingsBtn').addEventListener('click', () => ui.settings.classList.remove('hidden'));
        document.getElementById('closeSettings').addEventListener('click', () => {
            config.warmup = parseInt(document.getElementById('input-warmup').value) || 300;
            config.run = parseInt(document.getElementById('input-run').value) || 60;
            config.walk = parseInt(document.getElementById('input-walk').value) || 180;
            config.rounds = parseInt(document.getElementById('input-rounds').value) || 8;
            config.cooldown = parseInt(document.getElementById('input-cooldown').value) || 300;
            ui.settings.classList.add('hidden');
        });

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
		</html>
